<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">截图练习图</title>
  <desc id="desc">一张示例笔记，包含中文、英文和日文文字，用来在网页里练习框选和标注。不是真实的应用截图。</desc>
  <rect width="1280" height="800" fill="#e8e8ed"/>
  <rect x="72" y="58" width="1136" height="684" rx="14" fill="#ffffff"/>
  <path d="M72 72a14 14 0 0 1 14-14h1108a14 14 0 0 1 14 14v34H72z" fill="#f5f5f7"/>
  <circle cx="102" cy="82" r="7" fill="#ff5f57"/><circle cx="126" cy="82" r="7" fill="#febc2e"/><circle cx="150" cy="82" r="7" fill="#28c840"/>
  <path d="M72 106H1208" fill="none" stroke="#e5e5ea" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans,sans-serif">
    <text x="640" y="88" fill="#86868b" font-size="15" text-anchor="middle">会议记录.txt</text>
    <text x="132" y="190" fill="#86868b" font-size="18">10 月 24 日 · 周会</text>
    <text x="128" y="270" fill="#1d1d1f" font-size="58" font-weight="700">下周三之前完成设计评审</text>
    <text x="132" y="340" fill="#424245" font-size="25">负责人：设计组。需要准备两种方案和对比截图。</text>
    <rect x="132" y="382" width="420" height="44" rx="8" fill="#fbf1e0"/>
    <text x="148" y="412" fill="#ad7111" font-size="21" font-weight="600">待办：发布 0.6.0 之前更新官网截图</text>
    <text x="132" y="534" fill="#1d1d1f" font-size="27" font-weight="600">Less effort. More clarity.</text>
    <text x="132" y="578" fill="#6e6e73" font-size="23">Review the draft before Friday.</text>
    <text x="736" y="534" fill="#1d1d1f" font-size="27" font-weight="600">毎日を、少しシンプルに。</text>
    <text x="736" y="578" fill="#6e6e73" font-size="23">金曜日までに確認してください。</text>
    <text x="132" y="701" fill="#86868b" font-size="16">示例文字，可随意框选和标注</text>
    <text x="1148" y="701" fill="#86868b" font-size="16" text-anchor="end">⇧⌘A 框选</text>
  </g>
  <path d="M132 470H1148" fill="none" stroke="#e5e5ea" stroke-width="1"/>
</svg>
