# Canonical XcodeGen specification for the native app and its hosted tests.
name: niko-shot
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
targets:
  niko-shot:
    type: application
    platform: macOS
    sources: [niko-shot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n1ko.niko-shot
        PRODUCT_NAME: niko-shot
        PRODUCT_MODULE_NAME: NikoShot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: niko-shot/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: niko-shot/Resources/niko-shot.entitlements
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
  NikoShotTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: niko-shot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n1ko.niko-shot.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/niko-shot.app/Contents/MacOS/niko-shot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  niko-shot:
    build:
      targets:
        niko-shot: all
        NikoShotTests: [test]
    test:
      targets: [NikoShotTests]
      gatherCoverageData: true
