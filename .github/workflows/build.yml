# Tests every change; version tags publish complete, traceable GitHub Releases.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    name: Test and build Mac applications
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain and install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift -version
          brew install xcodegen
          xcodegen --version
          mkdir -p build/evidence
          xcodegen generate 2>&1 | tee build/evidence/ci-generate.log

      - name: Validate release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH.')
          version = re.search(r'^        MARKETING_VERSION: ([^\n]+)$', Path('project.yml').read_text(), re.M)
          if not version or tag != 'v' + version[1].strip():
              raise SystemExit('Release tag and application version differ.')
          if not Path(f'docs/releases/{tag}.md').is_file():
              raise SystemExit('A versioned release note is required.')
          PYTHON

      - name: Clean build and hosted tests with strict Swift 6 concurrency
        run: |
          set -euo pipefail
          xcodebuild -scheme niko-shot -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/CI-Debug -resultBundlePath build/evidence/ci-tests.xcresult \
            -parallel-testing-enabled NO SWIFT_VERSION=6.0 SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            clean build test 2>&1 | tee build/evidence/ci-tests.log

      - name: Prepare optional Developer ID and notarization credentials
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_P12_BASE64" ]]; then
            if [[ -n "${CERTIFICATE_PASSWORD}${DEVELOPER_ID_APPLICATION}${APPLE_ID}${APPLE_APP_PASSWORD}${APPLE_TEAM_ID}" ]]; then
              echo 'Signing credentials are incomplete: configure the P12 certificate or remove the partial configuration.' >&2
              exit 1
            fi
            echo 'Signing metadata: ad-hoc; notarized=false.'
            exit 0
          fi
          [[ "$DEVELOPER_ID_APPLICATION" == 'Developer ID Application:'* ]]
          signing_team="${DEVELOPER_ID_APPLICATION##*\(}"
          signing_team="${signing_team%\)}"
          [[ "$signing_team" =~ ^[A-Z0-9]{10}$ ]]
          signing_dir="$(mktemp -d "$RUNNER_TEMP/niko-shot-signing.XXXXXX")"
          signing_keychain="$signing_dir/signing.keychain-db"
          printf 'CI_SIGNING_DIR=%s\nCI_SIGNING_KEYCHAIN=%s\n' "$signing_dir" "$signing_keychain" >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$signing_dir/certificate.p12"
          chmod 600 "$signing_dir/certificate.p12"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$signing_dir/certificate.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -k "$signing_keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$signing_dir/certificate.p12"
          printf 'CI_SIGNING_IDENTITY=%s\nCI_SIGNING_TEAM=%s\n' "$DEVELOPER_ID_APPLICATION" "$signing_team" >> "$GITHUB_ENV"
          if [[ -n "${APPLE_ID}${APPLE_APP_PASSWORD}${APPLE_TEAM_ID}" ]]; then
            : "${APPLE_ID:?Missing APPLE_ID}" "${APPLE_APP_PASSWORD:?Missing APPLE_APP_PASSWORD}" "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
            xcrun notarytool store-credentials niko-shot-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$signing_keychain" >/dev/null
            echo 'NOTARY_PROFILE=niko-shot-ci' >> "$GITHUB_ENV"
          fi

      - name: Build independent optimized arm64 and x86_64 applications
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for architecture in arm64 x86_64; do
            xcodebuild -scheme niko-shot -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath "build/CI-Release-$architecture" ARCHS="$architecture" ONLY_ACTIVE_ARCH=NO \
              SWIFT_VERSION=6.0 SWIFT_STRICT_CONCURRENCY=complete SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              GCC_TREAT_WARNINGS_AS_ERRORS=YES ENABLE_TESTABILITY=NO CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="${CI_SIGNING_IDENTITY:--}" DEVELOPMENT_TEAM="${CI_SIGNING_TEAM:-}" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              clean build 2>&1 | tee "build/evidence/ci-release-$architecture.log"
          done

      - name: Verify both architectures and seal ZIP, DMG, checksums and provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for architecture in arm64 x86_64; do
            scripts/ci-package.sh "build/CI-Release-$architecture/Build/Products/Release/niko-shot.app" build/ci-dist "$architecture"
          done
          python3 scripts/release-manifest.py build/ci-dist

      - name: Delete temporary signing material
        if: always()
        run: |
          if [[ -n "${CI_SIGNING_KEYCHAIN:-}" && -f "$CI_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$CI_SIGNING_KEYCHAIN"
          fi
          if [[ -n "${CI_SIGNING_DIR:-}" && -d "$CI_SIGNING_DIR" ]]; then
            rm -rf "$CI_SIGNING_DIR"
          fi

      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested installation packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installation-packages
          path: build/ci-dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish versioned Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: niko-shot-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out this release's source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested installation packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installation-packages
          path: distribution

      - name: Validate version, provenance and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/release-manifest.py distribution --verify
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          info = json.loads(Path('distribution/release-info.json').read_text())
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          assert tag == 'v' + info['version']
          assert info['commit'] == os.environ['RELEASE_SHA']
          assert info['sourceProvenance'] == 'github-actions'
          repository = os.environ['RELEASE_REPOSITORY']
          base = f'https://github.com/{repository}/releases/download/{tag}'
          notes = Path(f'docs/releases/{tag}.md').read_text().rstrip()
          notes += f"""

          ### 下载与安装

          适用于 macOS {info['minimumMacOS']} 或更新版本。在苹果菜单「关于本机」确认芯片类型，下载对应安装包，将 niko-shot.app 拖入「应用程序」。

          | 你的 Mac | DMG | ZIP |
          |---|---|---|
          | M 芯片 · Apple Silicon | [下载 DMG]({base}/niko-shot-arm64.dmg) | [下载 ZIP]({base}/niko-shot-arm64.zip) |
          | Intel | [下载 DMG]({base}/niko-shot-x86_64.dmg) | [下载 ZIP]({base}/niko-shot-x86_64.zip) |

          首次打开如收到系统提示，可按 [Apple 的打开说明](https://support.apple.com/zh-cn/102445)在「隐私与安全性」中处理。

          [官网](https://baogutang.github.io/niko-shot/) · [翻译服务接入指南](https://baogutang.github.io/niko-shot/guide.html) · [SHA256 校验文件]({base}/SHA256SUMS) · [版本、签名与构建信息]({base}/release-info.json)

          构建号 {info['build']} · [源码](https://github.com/{repository}/commit/{info['commit']}) · [自动构建记录]({info['runUrl']})
          """
          Path('release-notes.md').write_text(notes + '\n')
          PYTHON

      - name: Upload complete assets and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" distribution/* --verify-tag --target "$RELEASE_SHA" \
            --draft --latest=false --title "niko-shot $version" --notes-file release-notes.md
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > uploaded-release.json
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('uploaded-release.json').read_text())
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert release['draft'] is True and release['prerelease'] is False
          files = {path.name: path for path in Path('distribution').iterdir()}
          assets = release['assets']
          assert len(assets) == len(files) == 8
          assert {asset['name'] for asset in assets} == set(files)
          for asset in assets:
              path = files[asset['name']]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PYTHON
          if gh api "repos/$GH_REPO/releases/latest" > latest-release.json 2> latest-error.txt; then
            mark_latest="$(python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          previous = json.loads(Path('latest-release.json').read_text())['tag_name']
          match = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', previous)
          current = tuple(map(int, os.environ['RELEASE_TAG'][1:].split('.')))
          print('true' if not match or current >= tuple(map(int, match.groups())) else 'false')
          PYTHON
            )"
          elif grep -q 'HTTP 404' latest-error.txt; then
            mark_latest=true
          else
            cat latest-error.txt >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false --prerelease=false --latest="$mark_latest"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > published-release.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = json.loads(Path('published-release.json').read_text())
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert release['draft'] is False and release['prerelease'] is False
          assert len(release['assets']) == 8
          print(release['html_url'])
          PYTHON
